
name: VERSUM ERP CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore VERSUM.KitchenWareERP.csproj

      - name: Build Project
        run: dotnet build VERSUM.KitchenWareERP.csproj --configuration Release --no-restore

      - name: Publish Application
        run: dotnet publish VERSUM.KitchenWareERP.csproj --configuration Release --no-build --output ./publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VERSUM-KitchenWare-ERP
          path: ./publish
